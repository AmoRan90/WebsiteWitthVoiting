<h1>Создать опрос</h1>
$error_block

<form method="post" action="/polls/new" class="card" id="poll-form" onsubmit="prepareData(event)">
  <input type="hidden" name="questions_json" id="questions_json">
  
  <label>Название <input name="title" required maxlength="200" autofocus></label>
  <label>Описание (необязательно) <textarea name="description" rows="2"></textarea></label>
  
  <div style="display: flex; flex-direction: column; gap: 10px; margin: 15px 0;">
    <label style="flex-direction: row; align-items: center; gap: 8px; cursor: pointer; font-weight: bold;">
      <input type="checkbox" name="is_test" id="is_test" onchange="toggleTestMode()"> Режим тестирования
    </label>
    
    <label style="flex-direction: row; align-items: center; gap: 8px; cursor: pointer;">
      <input type="checkbox" name="allow_retake"> Разрешить проходить заново
    </label>

    <label style="flex-direction: row; align-items: center; gap: 8px; cursor: pointer;">
      <input type="checkbox" id="use_timer" onchange="toggleTimer()"> Ограничить время прохождения
    </label>

    <!-- Поле для ввода времени (скрыто по умолчанию) -->
    <div id="timer-input-block" style="display: none; margin-left: 24px;">
      <label>Время в минутах (от 1 до 60) 
        <input type="number" name="time_limit" min="1" max="60" placeholder="Например: 15" style="width: 150px;">
      </label>
    </div>
  </div>

  <div id="questions-container"></div>

  <button type="button" onclick="addQuestion()">+ Добавить вопрос</button>
  <hr style="width: 100%; border: 0; border-top: 1px solid #e5e7eb; margin: 10px 0;">
  <button type="submit">Создать</button>
</form>

<p><a href="/">← К списку опросов</a></p>

<script>
  var questionCount = 0;

  function toggleTimer() {
    var useTimer = document.getElementById('use_timer').checked;
    var block = document.getElementById('timer-input-block');
    if (useTimer) {
      block.style.display = 'block';
    } else {
      block.style.display = 'none';
      block.querySelector('input[name="time_limit"]').value = '';
    }
  }

  function toggleTestMode() {
    var blocks = document.querySelectorAll('.question-block');
    blocks.forEach(function(block) { updateQuestionBlock(block); });
  }

  function updateQuestionBlock(block) {
    var isTest = document.getElementById('is_test').checked;
    var optContainer = block.querySelector('.options-list');
    var options = optContainer.querySelectorAll('.option-row');
    
    options.forEach(function(row) {
      var markerDiv = row.querySelector('.correct-marker');
      if (isTest) {
        markerDiv.innerHTML = '<input type="radio" name="correct_' + block.dataset.id + '" required title="Отметить как правильный">';
      } else {
        markerDiv.innerHTML = '';
      }
    });
  }

  function addQuestion() {
    questionCount++;
    var container = document.getElementById('questions-container');
    var div = document.createElement('div');
    div.className = 'question-block';
    div.dataset.id = questionCount;
    div.style = 'border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 6px;';
    
    var html = '<label>Вопрос ' + questionCount + ' <input class="q-text" required></label>';
    html += '<div class="options-list" style="margin-top: 10px;"></div>';
    html += '<button type="button" class="add-opt" onclick="addOption(this)">+ Вариант</button>';
    
    div.innerHTML = html;
    container.appendChild(div);
    addOption(div.querySelector('.add-opt')); 
  }

  function addOption(btn) {
    var block = btn.closest('.question-block');
    var list = block.querySelector('.options-list');
    if (list.children.length >= 5) { alert('Максимум 5 вариантов!'); return; }
    
    var row = document.createElement('div');
    row.className = 'option-row';
    row.style = 'display:flex; align-items:center; gap:10px; margin-top: 5px;';
    
    var markerDiv = document.createElement('div');
    markerDiv.className = 'correct-marker';
    
    var input = document.createElement('input');
    input.className = 'opt-text';
    input.required = true;
    input.placeholder = 'Текст варианта';
    
    row.appendChild(markerDiv);
    row.appendChild(input);
    list.appendChild(row);
    
    updateQuestionBlock(block);
  }

  function prepareData(e) {
    var blocks = document.querySelectorAll('.question-block');
    if (blocks.length === 0) { alert('Добавьте вопрос!'); e.preventDefault(); return; }
    var isTest = document.getElementById('is_test').checked;
    
    var data = [];
    var valid = true;
    blocks.forEach(function(block) {
      var text = block.querySelector('.q-text').value;
      var opts = [];
      var correctIdx = -1;
      var optRows = block.querySelectorAll('.option-row');
      
      optRows.forEach(function(row, index) {
        var val = row.querySelector('.opt-text').value;
        opts.push(val);
        if (isTest) {
          var radio = row.querySelector('input[type="radio"]');
          if (radio && radio.checked) correctIdx = index;
        }
      });
      
      if (isTest && correctIdx === -1) valid = false;
      data.push({ text: text, options: opts, correct: correctIdx });
    });
    
    if (isTest && !valid) { alert('Отметьте правильный ответ для каждого вопроса!'); e.preventDefault(); return; }
    document.getElementById('questions_json').value = JSON.stringify(data);
  }

  window.onload = function() { addQuestion(); };
</script>
